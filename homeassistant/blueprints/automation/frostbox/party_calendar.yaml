blueprint:
  name: Frostbox – Party mode before calendar events
  description: >-
    Starts party mode (Power Cool + Power Freeze + FlexZone beverage mode)
    a few hours before calendar events whose title contains a keyword.
  domain: automation
  source_url: https://github.com/coral-coder/frostbox/blob/main/homeassistant/blueprints/automation/frostbox/party_calendar.yaml
  input:
    calendar:
      name: Calendar
      selector:
        entity:
          filter:
            - domain: calendar
    keywords:
      name: Keywords
      description: Comma-separated; matched against the event title (case-insensitive).
      default: "party, bbq, game night, guests, birthday, dinner party"
      selector:
        text:
    lead_time:
      name: How long before
      description: Negative offset, e.g. -4:00:00 for four hours before.
      default: "-4:00:00"
      selector:
        text:
    duration_hours:
      name: Keep party mode on for
      default: 8
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h

trigger:
  - trigger: calendar
    event: start
    entity_id: !input calendar
    offset: !input lead_time

variables:
  keywords: !input keywords
  duration: !input duration_hours

condition:
  - condition: template
    value_template: >-
      {% set title = trigger.calendar_event.summary | lower %}
      {{ keywords.split(',') | map('trim') | map('lower') | select('in', title) | list | count > 0 }}

action:
  - action: frostbox.activate_mode
    data:
      mode: party
      hours: "{{ duration }}"
